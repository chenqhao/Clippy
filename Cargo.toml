[package]
name = "uclip"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.6.1"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
gethostname = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.6"
uuid = { version = "1.26.1", features = ["serde", "v4"] }

[dev-dependencies]
assert_cmd = "2.2.2"
temp-env = "0.3.6"
tempfile = "3.27.0"
